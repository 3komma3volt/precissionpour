; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = ESP32_2432S028

[common_env_data]
graphics_build_flags = 
	-DESP32Graphics=true
	-DLV_LVGL_H_INCLUDE_SIMPLE=true
	-DSKINNABLE=true
	-Isrc/ui/
	-Isrc/driver/
lib_deps_external_esp32 = ${common_env_data.lib_deps_external}
lib_deps_external = 
	lvgl@8.4.0
lib_deps = ${common_env_data.lib_deps_external_esp32}

[env:ESP32_2432S028]
platform = espressif32@6.8.1
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.mcu = esp32
lib_extra_dirs = ./lib
lib_deps = 
    ${common_env_data.lib_deps_external_esp32}
    SPI
    bodmer/TFT_eSPI@^2.5.43
    bodmer/TFT_Touch@^0.3
    olkal/HX711_ADC@^1.2.12

board_build.partitions = ./partition.csv
build_flags = -Wl,-Map,output.map
	${common_env_data.graphics_build_flags}
	-DESP32_2432S028_ESPI
	-DUSER_SETUP_LOADED=1
	-DILI9341_DRIVER=1
	-DTFT_MISO=12
	-DTFT_MOSI=13
	-DTFT_SCLK=14
	-DTFT_CS=15
	-DTFT_DC=2
	-DTFT_RST=-1
	-DTFT_BL=21
	-DTFT_WIDTH=240
	-DTFT_HEIGHT=320
	-DLOAD_GLCD=1
	-DLOAD_FONT2=1
	-DLOAD_FONT4=1
	-DLOAD_FONT6=1
	-DLOAD_FONT7=1
	-DLOAD_FONT8=1
	-DLOAD_GFXFF=1
	-DSMOOTH_FONT=1
	-DSPI_FREQUENCY=55000000
	-DSPI_READ_FREQUENCY=20000000
	-DSPI_TOUCH_FREQUENCY=2500000
